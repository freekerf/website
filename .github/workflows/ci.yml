name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE: 24

jobs:
  test:
    # types, unit + integration tests with coverage, build, HTML and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: unit and integration tests with coverage (src/lib, scripts/lib ≥ 90 % lines)
        run: npm run coverage
      - name: coverage in the job summary
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| website (Vitest) | lines | statements | functions | branches |\n|---|---|---|---|---|\n| total | '+['lines','statements','functions','branches'].map(k=>t[k].pct+' %').join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
      - name: build (recorded releases, root base path)
        run: npm run build
        env:
          FK_RELEASES_FIXTURE: tests/fixtures/releases.json
          BASE_PATH: /
      - run: npm run validate:html
      - name: internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true

  design:
    # the tokens, fonts and logos equal freekerf/design at design.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: freekerf/design
          path: design-checkout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - run: node scripts/sync-design.mjs --check --design design-checkout

  e2e:
    # Chromium, Firefox and WebKit; axe on every page at three widths and two themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
